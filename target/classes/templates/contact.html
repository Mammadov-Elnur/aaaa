<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a Guide | Baku Guide</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: header('contact')}"></div>

<main class="container narrow">
    <h1 class="page-title">Request a Guided Tour</h1>
    <p class="lead">Tell us what you'd like to see and a local guide will get back to you.</p>

    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/contact}" th:object="${inquiry}" method="post" class="form">
        <div class="field">
            <label for="name">Full name</label>
            <input id="name" type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="row">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="phone">Phone (optional)</label>
                <input id="phone" type="tel" th:field="*{phone}">
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label for="preferredDate">Preferred date</label>
                <input id="preferredDate" type="date" th:field="*{preferredDate}">
                <span class="error" th:if="${#fields.hasErrors('preferredDate')}" th:errors="*{preferredDate}"></span>
            </div>
            <div class="field">
                <label for="groupSize">Group size</label>
                <input id="groupSize" type="number" min="1" max="50" th:field="*{groupSize}">
                <span class="error" th:if="${#fields.hasErrors('groupSize')}" th:errors="*{groupSize}"></span>
            </div>
        </div>

        <div class="field">
            <label for="tourType">Tour type</label>
            <select id="tourType" th:field="*{tourType}">
                <option value="">-- Select a tour --</option>
                <option th:each="t : ${tourTypes}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('tourType')}" th:errors="*{tourType}"></span>
        </div>

        <div class="field">
            <label for="message">Anything else?</label>
            <textarea id="message" rows="5" th:field="*{message}"
                      placeholder="Interests, language preference, accessibility needs..."></textarea>
            <span class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></span>
        </div>

        <button type="submit" class="btn">Send Request</button>
    </form>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
